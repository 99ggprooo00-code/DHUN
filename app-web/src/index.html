<!doctype html>
<html lang="en" data-dhun-theme="dark" data-dhun-accent="brand">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DHUN — the web build</title>
    <!--
      The document's copy is copy: the tab title, the install name, the line a
      share sheet shows. It says what this build is — a music player for the
      browser that reads JioSaavn's public catalogue — and not what it cannot
      promise: it is an unofficial wrapper, and the app says so on screen.
    -->
    <meta
      name="description"
      content="DHUN in the browser: search JioSaavn's catalogue, play it, and keep likes, playlists and history on your own device. No account, no DHUN server, no telemetry."
    />
    <!--
      Out of the index on purpose. A crawler gets an empty `<div id="app">` and a
      module graph, because the interface is assembled in the browser from the
      visitor's own library and a live catalogue. There is no page here to rank,
      and an app shell in search results would be a result that cannot show
      anything until it runs. `scripts/website_smoke.py` asserts this line on the
      served bytes.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F6F4F1" media="(prefers-color-scheme: light)" />
    <meta name="application-name" content="DHUN" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DHUN" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!--
      Content-Security-Policy, and what each widening is for.

      `script-src 'self'` is the point: no inline script, no eval, no CDN, no
      third-party runtime of any kind. `style-src` needs 'unsafe-inline' because
      the app writes an inline `background-image` on a hero's blurred backdrop;
      there is no user-controlled CSS path.

      `connect-src` names the three catalogue instances this build will try
      (`api.js` → `API_SOURCES`) and the CDN the audio streams from; `media-src`
      names that CDN. Images come from it too. Nothing else is reachable from
      this page — no analytics, no fonts, no telemetry endpoint, because there
      are none to reach. Adding a fourth instance is a CSP change as well as a
      code change, which is the point: a request to a host nobody wrote down is
      a request a visitor was not told about.

      `frame-ancestors` is absent, and its absence is honest rather than a
      choice: it is a response-header directive, the specification requires a
      `<meta>` CSP to ignore it, and GitHub Pages serves a project site with no
      header control. The rule is enforced where this build can enforce it — the
      app refuses to boot inside a frame and says why.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.saavncdn.com; media-src https://*.saavncdn.com blob:; connect-src https://saavn.dev https://saavn.sumit.co https://saavnx.vercel.app https://*.saavncdn.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none';"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icon-192.png" />
    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/app.css" />
    <script type="module" src="./js/main.js"></script>
  </head>
  <body>
    <!--
      The app's regions. Every one of them is a real element in the document
      before the module runs, so the first paint is the shell rather than a blank
      page, and `scripts/test_app_web.py` asserts that each exists.
    -->
    <div id="app" class="dhun-app" data-player="closed" data-has-track="false">
      <a class="dhun-skip-link" href="#main">Skip to content</a>
      <div id="dhun-topbar" class="dhun-topbar"></div>
      <div id="dhun-rail-region" class="dhun-rail-region"></div>
      <main id="main" class="dhun-main" tabindex="-1">
        <div id="dhun-view" class="dhun-view" aria-live="polite"></div>
      </main>
      <div id="dhun-dock" class="dhun-dock"></div>
      <div id="dhun-nav-region" class="dhun-nav-region"></div>
      <div id="dhun-overlay" class="dhun-overlay"></div>
      <div id="dhun-sheet" class="dhun-sheet-region"></div>
      <div id="dhun-toast" class="dhun-toast-region" aria-live="polite" aria-atomic="true"></div>
    </div>
    <audio id="dhun-audio" preload="metadata" crossorigin="anonymous"></audio>
    <noscript>
      <div class="dhun-noscript">
        <h1>DHUN needs JavaScript</h1>
        <p>
          The interface is assembled in your browser: the catalogue is fetched from
          JioSaavn's public API, and your likes, playlists and history live in this
          browser's storage. Nothing is pre-rendered, so with scripting disabled there
          is no player to show. The Android and Windows builds do not need it.
        </p>
        <p><a href="../">Back to the DHUN site</a></p>
      </div>
    </noscript>
  </body>
</html>
