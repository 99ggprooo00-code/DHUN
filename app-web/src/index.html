<!doctype html>
<html lang="en" data-dhun-theme="dark" data-dhun-accent="brand">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DHUN — play YouTube Music in your browser</title>
    <meta
      name="description"
      content="DHUN is a free, open-source music player. This is its web build: search and play YouTube Music anonymously from your browser, with a library that stays on your device."
    />
    <!-- Out of the index, and not as a hedge: what a crawler gets here is an
         empty `<div id="app">` and a module graph, because the interface is
         built in the browser from the visitor's own library. There is no page
         here to rank, and an app shell in search results would be a result
         that cannot show anything until it runs. The site's own routes are what
         belong in the index; `scripts/website_smoke.py` asserts this line on
         the served bytes, and the site's sitemap lists no `/app/` route. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F6F4F1" media="(prefers-color-scheme: light)" />
    <meta name="application-name" content="DHUN" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DHUN" />
    <!--
      Content-Security-Policy, and what each widening is for.

      `script-src 'self'` is the whole point: no inline script, no eval, no CDN.
      `style-src` needs 'unsafe-inline' because the app writes an inline
      `background-image` gradient on artwork placeholders and the theme is
      applied as a data attribute; there is no user-controlled CSS path.

      The network directives are wide on purpose and worth being explicit about.
      A music client's whole job is to fetch media from somewhere the app does
      not control: YouTube's own endpoints and its `googlevideo.com` CDN, LRCLIB
      for lyrics, artwork from `googleusercontent.com`/`ytimg.com`, and — when a
      visitor configures one — their own endpoint on any HTTPS host. Constraining
      those to a hard-coded list would break the one escape hatch that exists for
      a blocked network. What is *not* allowed is being widened: no
      `script-src 'unsafe-eval'`, no `frame-src`, no `object-src`, no inline
      event handlers, and `base-uri`/`form-action` stay locked to 'none'.

      `frame-ancestors 'none'` is deliberately absent, and its absence is a
      limitation rather than a choice. It is a response-header directive: the
      specification requires a `<meta>` CSP to ignore it, Chrome logs exactly
      that on every load, and GitHub Pages serves a project site with no header
      control — so the directive would have been dead configuration that looked
      like protection. The rule itself is still enforced, in the one place this
      build can enforce it: the app refuses to boot inside a frame
      (`isFramed` in js/platform.js, the guard at the top of `boot()`), and the
      visitor gets an explanation instead of a Play button wearing somebody
      else's page as a costume.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' https: blob:; connect-src 'self' https:; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icon-192.png" />
    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <div class="dhun-noscript">
        <h1>DHUN needs JavaScript</h1>
        <p>
          This is an application, not a document: every screen is built in the browser and the audio
          engine is part of the page. With scripting disabled the interface cannot render at all.
        </p>
        <p>
          The Android and Windows builds do not need it. See
          <a href="../">the DHUN project page</a> for downloads, or read the source at
          <a href="https://github.com/99ggprooo00-code/DHUN">github.com/99ggprooo00-code/DHUN</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
