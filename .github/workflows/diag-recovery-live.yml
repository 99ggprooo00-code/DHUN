name: diag-recovery-live

# TEMPORARY diagnostic for the 2026-10-31 phone recovery report.
# Delete after collecting Search params and /next response-shape evidence.
# Only statuses, renderer names and counts are emitted; live JSON stays on the runner.

on:
  push:
    branches: [arena/09e5238e-dhun]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Compare anonymous Search params and capture Next shape
        shell: bash
        run: |
          set +e
          mkdir -p probe
          python3 - <<'PY'
          import copy, json, os, re, urllib.error, urllib.request

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36")
          BASE = "https://music.youtube.com"

          def emit(text):
              text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::warning title=recovery-probe::{text}", flush=True)

          req = urllib.request.Request(BASE + "/", headers={"User-Agent": UA, "Accept-Language": "en-US,en;q=0.9"})
          with urllib.request.urlopen(req, timeout=30) as response:
              html = response.read().decode("utf-8", "replace")
          version_match = re.search(r'"INNERTUBE_CLIENT_VERSION"\s*:\s*"([0-9.]+)"', html)
          if not version_match:
              emit("homepage client version missing")
              raise SystemExit(0)
          version = version_match.group(1)
          context = {"client": {"clientName": "WEB_REMIX", "clientVersion": version, "hl": "en", "gl": "US"}, "user": {}}
          marker = re.search(r'"INNERTUBE_CONTEXT"\s*:\s*', html)
          if marker:
              try:
                  served, _ = json.JSONDecoder().raw_decode(html[marker.end():])
                  if isinstance(served, dict) and (served.get("client") or {}).get("clientName") == "WEB_REMIX":
                      context = served
              except Exception:
                  pass
          client = dict(context.get("client") or {})
          client.update({"clientName": "WEB_REMIX", "clientVersion": version, "hl": "en", "gl": "US"})
          context["client"] = client
          visitor = client.get("visitorData")
          if not visitor:
              match = re.search(r'"visitorData"\s*:\s*"([^"]+)"', html)
              visitor = match.group(1) if match else None
          if visitor:
              client["visitorData"] = visitor
          headers = {
              "Content-Type": "application/json", "User-Agent": UA,
              "Accept-Language": "en-US,en;q=0.9", "X-YouTube-Client-Name": "67",
              "X-YouTube-Client-Version": version, "Origin": BASE, "Referer": BASE + "/",
          }
          if visitor:
              headers["X-Goog-Visitor-Id"] = visitor
          emit(f"homepage clientVersion={version} servedContext={bool(marker)} visitorPresent={bool(visitor)}")

          def post(endpoint, fields, output=None):
              body = {"context": copy.deepcopy(context), **copy.deepcopy(fields)}
              request = urllib.request.Request(
                  f"{BASE}/youtubei/v1/{endpoint}?alt=json",
                  data=json.dumps(body).encode(), headers=headers, method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=40) as response:
                      status, text = response.status, response.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as error:
                  status, text = error.code, error.read().decode("utf-8", "replace")
              except Exception as error:
                  status, text = -1, f"{type(error).__name__}"
              if status == 200 and output:
                  open(output, "w").write(text)
              return status, text

          params = {
              "all": None,
              "old-songs": "EgWKAQIIAWoKEAkQBRAKEAMQBA%3D%3D",
              "old-songs-decoded": "EgWKAQIIAWoKEAkQBRAKEAMQBA==",
              "current-songs": "EgWKAQIIAWoMEA4QChADEAQQCRAF",
              "current-videos": "EgWKAQIQAWoMEA4QChADEAQQCRAF",
              "current-artists": "EgWKAQIgAWoMEA4QChADEAQQCRAF",
              "current-albums": "EgWKAQIYAWoMEA4QChADEAQQCRAF",
              "old-playlists": "EgWKAQIOAWoKEAkQChAFEAMQBA%3D%3D",
              "current-playlists": "Eg-KAQwIABAAGAAgACgBMABqChAEEAMQCRAFEAo%3D",
          }
          for name, value in params.items():
              fields = {"query": "Oasis"}
              if value is not None:
                  fields["params"] = value
              output = f"probe/search-{name}.json" if name in ("all", "old-songs", "current-songs") else None
              status, text = post("search", fields, output)
              detail = ""
              if status != 200:
                  try:
                      error = (json.loads(text).get("error") or {})
                      detail = f" status={error.get('status')} reason={(error.get('details') or [{}])[0].get('reason')}"
                  except Exception:
                      pass
              emit(f"search {name} http={status} bytes={len(text)}{detail}")

          # The phone reports NP locale. Exercise the exact built-in Focus query
          # through the same anonymous body before changing any filter constant.
          client["gl"] = "NP"
          for name, value in (("all", None), ("old-songs", params["old-songs"]),
                              ("current-songs", params["current-songs"])):
              fields = {"query": "focus instrumental music"}
              if value is not None:
                  fields["params"] = value
              status, text = post("search", fields, f"probe/search-np-{name}.json")
              emit(f"search NP focus {name} http={status} bytes={len(text)}")
          client["gl"] = "US"

          def count_key(value, key):
              if isinstance(value, dict):
                  return (1 if key in value else 0) + sum(count_key(v, key) for v in value.values())
              if isinstance(value, list):
                  return sum(count_key(v, key) for v in value)
              return 0

          video_id = "utwMHfDZ6SA"
          basic = {"videoId": video_id, "playlistId": "RDAMVM" + video_id}
          rich = {
              **basic,
              "enablePersistentPlaylistPanel": True,
              "isAudioOnly": True,
              "tunerSettingValue": "AUTOMIX_SETTING_NORMAL",
              "watchEndpointMusicSupportedConfigs": {"watchEndpointMusicConfig": {
                  "hasPersistentPlaylistPanel": True, "musicVideoType": "MUSIC_VIDEO_TYPE_ATV",
              }},
          }
          for name, fields in (("basic", basic), ("persistent", rich)):
              path = f"probe/next-{name}.json"
              status, text = post("next", fields, path)
              emit(f"next {name} http={status} bytes={len(text)}")
              if status == 200:
                  raw = json.loads(text)
                  counts = {key: count_key(raw, key) for key in (
                      "musicQueueRenderer", "playlistPanelRenderer", "playlistPanelVideoRenderer",
                      "playlistPanelVideoWrapperRenderer", "automixPlaylistVideoRenderer",
                      "messageRenderer", "alertRenderer", "nextRadioContinuationData",
                  )}
                  emit(f"next {name} rootKeys={sorted(raw.keys())} counts={counts}")
              else:
                  try:
                      error = (json.loads(text).get("error") or {})
                      emit(f"next {name} errorStatus={error.get('status')}")
                  except Exception:
                      pass
          client["gl"] = "NP"
          status, text = post("next", basic, "probe/next-np-basic.json")
          emit(f"next NP basic http={status} bytes={len(text)}")
          if status == 200:
              raw = json.loads(text)
              counts = {key: count_key(raw, key) for key in (
                  "musicQueueRenderer", "playlistPanelRenderer", "playlistPanelVideoRenderer",
                  "playlistPanelVideoWrapperRenderer", "automixPlaylistVideoRenderer",
                  "messageRenderer", "alertRenderer", "nextRadioContinuationData",
              )}
              emit(f"next NP basic rootKeys={sorted(raw.keys())} counts={counts}")
          PY

      - name: Parse captured responses with DHUN parsers
        shell: bash
        run: |
          set +e
          cat > shared/src/jvmTest/kotlin/dev/dhun/innertube/LiveRecoveryShapeProbeTest.kt <<'KT'
          package dev.dhun.innertube

          import dev.dhun.core.DhunError
          import dev.dhun.core.DhunResult
          import java.io.File
          import kotlinx.coroutines.runBlocking
          import kotlinx.serialization.json.Json
          import kotlinx.serialization.json.JsonObject
          import kotlin.test.Test

          class LiveRecoveryShapeProbeTest {
              private val probeDir = listOf(File("probe"), File("../probe"))
                  .firstOrNull { it.isDirectory } ?: File("probe")
              private val output = File(probeDir, "parser-result.txt")
              private fun probeFile(name: String) = File(probeDir, name)

              private fun emit(line: String) {
                  println(line)
                  output.appendText(line + "\n")
              }

              private fun capture(label: String, block: () -> String) {
                  val line = try {
                      label + block()
                  } catch (error: Throwable) {
                      val at = error.stackTrace.firstOrNull { it.className.startsWith("dev.dhun") }
                      "$label exception=${error::class.simpleName} at=$at"
                  }
                  emit(line)
              }

              @Test
              fun summarizeLiveShapes() {
                  output.writeText("")
                  for ((name, filter) in listOf("all" to SearchFilter.ALL, "old-songs" to SearchFilter.SONGS,
                      "current-songs" to SearchFilter.SONGS, "np-all" to SearchFilter.ALL,
                      "np-old-songs" to SearchFilter.SONGS, "np-current-songs" to SearchFilter.SONGS)) {
                      val file = probeFile("search-$name.json")
                      if (!file.isFile) { emit("search $name parser SKIP no response"); continue }
                      capture("search $name parser ") {
                          val root = Json.parseToJsonElement(file.readText()) as JsonObject
                          val page = parseSearchResults("Oasis", root, filter)
                          "songs=${page.songs.size} videos=${page.videos.size} token=${page.continuationToken != null}"
                      }
                  }
                  for (name in listOf("basic", "persistent", "np-basic")) {
                      val file = probeFile("next-$name.json")
                      if (!file.isFile) { emit("next $name parser SKIP no response"); continue }
                      capture("next $name parser ") {
                          val root = Json.parseToJsonElement(file.readText()) as JsonObject
                          val page = parseRadioQueuePage(root)
                          "tracks=${page.tracks.size} token=${page.continuationToken != null}"
                      }
                  }

                  // Exact DHUN CIO/request/context path, not the Python model.
                  val http = InnerTubeClient.defaultHttpClient()
                  try {
                      val client = InnerTubeClient(http, country = "NP")
                      runBlocking {
                          for (filter in listOf(SearchFilter.ALL, SearchFilter.SONGS)) {
                              try {
                                  when (val result = client.search("focus instrumental music", filter)) {
                                      is DhunResult.Success -> emit("live-client NP $filter songs=${result.value.songs.size} videos=${result.value.videos.size}")
                                      is DhunResult.Failure -> emit("live-client NP $filter error=${result.error::class.simpleName} detail=${(result.error as? DhunError.Parse)?.detail}")
                                  }
                              } catch (error: Throwable) {
                                  emit("live-client NP $filter exception=${error::class.simpleName}")
                              }
                          }
                          try {
                              when (val result = client.radioQueuePage("utwMHfDZ6SA")) {
                                  is DhunResult.Success -> emit("live-client NP next tracks=${result.value.tracks.size} token=${result.value.continuationToken != null}")
                                  is DhunResult.Failure -> emit("live-client NP next error=${result.error::class.simpleName} detail=${(result.error as? DhunError.Parse)?.detail}")
                              }
                          } catch (error: Throwable) {
                              emit("live-client NP next exception=${error::class.simpleName}")
                          }
                      }
                  } finally {
                      http.close()
                  }
              }
          }
          KT
          ./gradlew :shared:jvmTest --tests 'dev.dhun.innertube.LiveRecoveryShapeProbeTest' --no-daemon --console=plain > probe-gradle.txt 2>&1
          echo "gradle exit=$?"
          tail -n 20 probe-gradle.txt
          python3 - <<'PY'
          import os
          if os.path.isfile("probe/parser-result.txt"):
              for line in open("probe/parser-result.txt"):
                  line = line.strip()
                  if line:
                      esc = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::warning title=dhun-parser::{esc}", flush=True)
          else:
              print("::warning title=dhun-parser::no parser result", flush=True)
          PY
