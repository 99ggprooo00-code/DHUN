name: DHUN beta

# The rolling `beta` tag is a public prerelease titled "DHUN beta". Successful
# main builds replace it after Android/Desktop/shared verification unless a
# newly added one-shot preserve marker selects build-only. PRs and non-main refs
# only upload run-scoped artifacts. The fixed public prerelease remains separate
# and can be requested by manual dispatch or by adding its reviewed one-shot
# release-intent file (see scripts/release_plan.py).
on:
  workflow_dispatch:
    inputs:
      build_only:
        description: Build artifacts without updating GitHub releases
        type: boolean
        required: true
        default: true
      build_release_candidate:
        description: Also build a debug-signed Android App Bundle as an Actions artifact
        type: boolean
        required: true
        default: false
      purge_legacy_dev_releases:
        description: Irreversibly delete the legacy dev, dev-v0.1.0 and dev-v0.1.1 releases and tags. Publish path only. Leave unticked unless approved for this run.
        type: boolean
        required: true
        default: false
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - 'app-android/**'
      - 'app-desktop/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'scripts/**'
      - '.github/workflows/beta-release.yml'
      - '.github/release-intent/v1.00.002'
      # PR #223 uses a fresh one-shot build-only intent to preserve the rolling beta.
      - '.github/release-intent/preserve-rolling-beta-pr223'
      # Legacy internal filename retained so the migration is not itself
      # interpreted as a new build-only intent.
      - '.github/release-intent/preserve-rolling-test-draft'

permissions:
  contents: read

# test-release ended at run 867. Keep the renamed workflow's Android/MSI
# identities newer whether GitHub resets or continues its raw run counter.
# Build APK deliberately leaves this unset; Android versionCode uses time.
env:
  DHUN_BETA_RUN_OFFSET: '867'

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'beta-release' || format('beta-build-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  release_plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      build_only: ${{ steps.plan.outputs.build_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Verify a one-shot publication request from the prior main commit
        id: plan
        env:
          MANUAL_BUILD_ONLY: ${{ inputs.build_only }}
        run: |
          python scripts/release_plan.py \
            --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" \
            --manual-build-only "$MANUAL_BUILD_ONLY" --sha "$GITHUB_SHA" \
            --output "$GITHUB_OUTPUT"

  apk:
    needs: release_plan
    env:
      BUILD_ONLY: ${{ needs.release_plan.outputs.build_only }}
      DHUN_RELEASE_CHANNEL: ${{ needs.release_plan.outputs.channel }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Allocate increasing Android beta identity
        id: beta_version
        if: ${{ env.DHUN_RELEASE_CHANNEL == 'beta' }}
        run: python scripts/beta_version.py "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        env:
          BETA_VERSION_NAME: ${{ steps.beta_version.outputs.version_name }}
          BETA_VERSION_CODE: ${{ steps.beta_version.outputs.version_code }}
        run: |
          args=("-PdhunReleaseChannel=$DHUN_RELEASE_CHANNEL")
          if [ "$DHUN_RELEASE_CHANNEL" = beta ]; then
            args+=("-PdhunBetaVersionName=$BETA_VERSION_NAME" "-PdhunBetaVersionCode=$BETA_VERSION_CODE")
          fi
          ./gradlew :app-android:assembleDebug "${args[@]}" --no-daemon

      - name: Stage universal and ABI APKs with checksums and provenance
        run: |
          python scripts/stage_android_apks.py \
            app-android/build/outputs/apk/debug \
            out
          python scripts/stage_artifact.py out/dhun-beta.apk --build-only "$BUILD_ONLY"
          python scripts/stage_artifact.py out/dhun-beta-arm64-v8a.apk --build-only "$BUILD_ONLY"
          python scripts/stage_artifact.py out/dhun-beta-armeabi-v7a.apk --build-only "$BUILD_ONLY"

      - name: Verify packaged APK versions (all ABIs)
        env:
          BETA_VERSION_NAME: ${{ steps.beta_version.outputs.version_name }}
          BETA_VERSION_CODE: ${{ steps.beta_version.outputs.version_code }}
        run: |
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$aapt"
          test -n "$apksigner"
          if [ "$DHUN_RELEASE_CHANNEL" = public ]; then
            python scripts/check_android_identity.py "$aapt" out '1.00.002' 7 --apksigner "$apksigner"
          else
            python scripts/check_android_identity.py "$aapt" out "$BETA_VERSION_NAME" "$BETA_VERSION_CODE" --apksigner "$apksigner"
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: apk
          if-no-files-found: error
          retention-days: 14
          path: |
            out/dhun-beta.apk
            out/dhun-beta.apk.sha256
            out/dhun-beta.apk.provenance.txt
            out/dhun-beta-arm64-v8a.apk
            out/dhun-beta-arm64-v8a.apk.sha256
            out/dhun-beta-arm64-v8a.apk.provenance.txt
            out/dhun-beta-armeabi-v7a.apk
            out/dhun-beta-armeabi-v7a.apk.sha256
            out/dhun-beta-armeabi-v7a.apk.provenance.txt

  msi:
    needs: release_plan
    env:
      BUILD_ONLY: ${{ needs.release_plan.outputs.build_only }}
      DHUN_RELEASE_CHANNEL: ${{ needs.release_plan.outputs.channel }}
    runs-on: windows-latest
    # Keep the Windows job within the established release-check budget. Its
    # platform-specific UI smoke is intentionally small; the full visual state
    # matrix and OS-independent suites run in canonical CI on Linux.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # The full app state/screenshot matrix and OS-independent suites run in
      # canonical Linux CI. Windows keeps a small real Skiko primitive render
      # and live-appearance smoke before MSI packaging, avoiding a repeat of
      # the 89-frame matrix on the slower Windows renderer.
      - name: Live theme regression — Windows JVM
        shell: pwsh
        run: ./gradlew :app-desktop:jvmTest --tests "dev.dhun.desktop.VisualEvidenceTest" --tests "dev.dhun.desktop.LiveAppearanceTest" --no-daemon

      - name: Build MSI (jpackage)
        id: msi_build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = python scripts/installer_version.py $env:GITHUB_RUN_NUMBER $env:GITHUB_RUN_ATTEMPT
          if ($LASTEXITCODE -ne 0) { throw "Could not allocate MSI ProductVersion" }
          "installer_version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "MSI ProductVersion: $version"
          # Compose downloads WiX from a GitHub release during MSI packaging.
          # Retry only its transient 504 response; other build failures should
          # remain immediate and actionable rather than being retried blindly.
          $gradleLog = Join-Path $env:RUNNER_TEMP "dhun-package-msi.log"
          $gradleArgs = @(
            ":app-desktop:packageMsi",
            "-PdhunInstallerVersion=$version",
            "-PdhunReleaseChannel=$env:DHUN_RELEASE_CHANNEL",
            "--no-daemon"
          )
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Remove-Item $gradleLog -Force -ErrorAction SilentlyContinue
            Write-Host "Build MSI attempt $attempt of $maxAttempts"
            & ./gradlew @gradleArgs 2>&1 | Tee-Object -FilePath $gradleLog
            $gradleExitCode = $LASTEXITCODE
            if ($gradleExitCode -eq 0) { break }

            $gradleOutput = Get-Content -Raw -Path $gradleLog
            $transientWixGatewayTimeout = (
              $gradleOutput.Contains("downloadWix") -and
              $gradleOutput.Contains("HTTP status code: 504") -and
              $gradleOutput.Contains("wixtoolset/wix3/releases/download/")
            )
            if (-not $transientWixGatewayTimeout -or $attempt -eq $maxAttempts) {
              exit $gradleExitCode
            }
            $delaySeconds = 15 * $attempt
            Write-Warning "WiX download returned HTTP 504; retrying in $delaySeconds seconds."
            Start-Sleep -Seconds $delaySeconds
          }

      - name: Verify MSI identity and stage checksum/provenance
        shell: pwsh
        env:
          INSTALLER_VERSION: ${{ steps.msi_build.outputs.installer_version }}
        run: |
          try {
            ./scripts/stage_msi.ps1 -ExpectedVersion $env:INSTALLER_VERSION -BuildOnly $env:BUILD_ONLY
          } catch {
            $message = $_.ToString().Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error file=scripts/stage_msi.ps1,title=MSI staging::$message"
            exit 1
          }

      # On main (the only publishing path) install-over is REQUIRED: a skipped
      # baseline fails this step instead of passing green. PR and branch builds
      # may skip, and the skip is recorded as SKIPPED in result.txt.
      - name: Check install-over and userdata on disposable Windows
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRE_INSTALL_OVER: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
        run: |
          try {
            $require = $env:REQUIRE_INSTALL_OVER -eq 'true'
            ./scripts/check_msi_upgrade.ps1 -Candidate out/dhun-beta.msi -RequireInstallOver:$require
          } catch {
            $message = $_.ToString().Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error file=scripts/check_msi_upgrade.ps1,title=MSI install-over::$message"
            exit 1
          }

      - name: Preserve installer-check diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: msi-install-check
          if-no-files-found: ignore
          retention-days: 14
          path: out/installer-check/

      - uses: actions/upload-artifact@v6
        with:
          name: msi
          if-no-files-found: error
          retention-days: 14
          path: |
            out/dhun-beta.msi
            out/dhun-beta.msi.sha256
            out/dhun-beta.msi.provenance.txt
            out/READ-ME-FIRST.md

  aab:
    # Optional diagnostic artifact only; debug-key signed and not Play-ready.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release_candidate == true }}
    needs: release_plan
    env:
      BUILD_ONLY: ${{ needs.release_plan.outputs.build_only }}
      DHUN_RELEASE_CHANNEL: ${{ needs.release_plan.outputs.channel }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Allocate increasing Android beta identity
        id: beta_version
        if: ${{ env.DHUN_RELEASE_CHANNEL == 'beta' }}
        run: python scripts/beta_version.py "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Build debug-signed AAB
        env:
          BETA_VERSION_NAME: ${{ steps.beta_version.outputs.version_name }}
          BETA_VERSION_CODE: ${{ steps.beta_version.outputs.version_code }}
        run: |
          args=("-PdhunReleaseChannel=$DHUN_RELEASE_CHANNEL")
          if [ "$DHUN_RELEASE_CHANNEL" = beta ]; then
            args+=("-PdhunBetaVersionName=$BETA_VERSION_NAME" "-PdhunBetaVersionCode=$BETA_VERSION_CODE")
          fi
          ./gradlew :app-android:bundleDebug "${args[@]}" --no-daemon

      - name: Stage optional AAB
        run: |
          mkdir -p out
          cp app-android/build/outputs/bundle/debug/app-android-debug.aab out/dhun-v1.00.002.aab
          python scripts/stage_artifact.py out/dhun-v1.00.002.aab --build-only "$BUILD_ONLY"

      - uses: actions/upload-artifact@v6
        with:
          name: aab
          if-no-files-found: error
          retention-days: 14
          path: |
            out/dhun-v1.00.002.aab
            out/dhun-v1.00.002.aab.sha256
            out/dhun-v1.00.002.aab.provenance.txt

  publish_beta:
    # Ordinary verified main builds replace the public rolling beta. A new
    # build-only/public-fixed intent skips this job and leaves releases alone.
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.release_plan.outputs.channel == 'beta' && needs.release_plan.outputs.build_only == 'false' }}
    needs: [release_plan, apk, msi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: apk
          path: dist

      - uses: actions/download-artifact@v7
        with:
          name: msi
          path: dist

      - name: Verify the build is still the tip of main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::error::Refusing to publish a superseded main commit ($GITHUB_SHA; current $latest)"
            exit 1
          fi

      - name: Publish and verify the rolling DHUN beta prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Replace an earlier rolling beta only after all build gates pass and
          # every required installer is present. The legacy test release stays
          # until the new public beta has been verified.
          for asset in dhun-beta.apk dhun-beta-arm64-v8a.apk dhun-beta-armeabi-v7a.apk dhun-beta.msi; do
            if [ ! -s "dist/$asset" ]; then
              echo "::error::Required beta installer is missing or empty: $asset"
              exit 1
            fi
          done
          if gh release view beta --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete beta --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi

          # Checksums and revision provenance stay in internal build artifacts.
          # The public rolling beta deliberately exposes four installers only.
          gh release create beta \
            dist/dhun-beta.apk \
            dist/dhun-beta-arm64-v8a.apk \
            dist/dhun-beta-armeabi-v7a.apk \
            dist/dhun-beta.msi \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DHUN beta" \
            --notes-file docs/releases/rolling-beta.md \
            --prerelease

          expected_beta_assets=$(printf '%s\n' \
            "dhun-beta.apk" \
            "dhun-beta-arm64-v8a.apk" \
            "dhun-beta-armeabi-v7a.apk" \
            "dhun-beta.msi" | jq -R . | jq -sc 'sort')
          actual_beta_assets=$(gh release view beta --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | sort' | jq -c .)
          if [ "$actual_beta_assets" != "$expected_beta_assets" ]; then
            echo "::error::DHUN beta must contain exactly the four installers"
            echo "Expected: $expected_beta_assets"
            echo "Actual:   $actual_beta_assets"
            exit 1
          fi
          if [ "$(gh release view beta --repo "$GITHUB_REPOSITORY" --json name --jq '.name')" != "DHUN beta" ]; then
            echo "::error::The rolling release title must be exactly DHUN beta"
            exit 1
          fi
          if [ "$(gh release view beta --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')" != "$GITHUB_SHA" ]; then
            echo "::error::DHUN beta does not target this build commit"
            exit 1
          fi
          if [ "$(gh release view beta --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')" != "beta" ]; then
            echo "::error::The rolling prerelease tag must be exactly beta"
            exit 1
          fi
          if [ "$(gh release view beta --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" != "false" ]; then
            echo "::error::DHUN beta must be public, not a draft"
            exit 1
          fi
          if [ "$(gh release view beta --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')" != "true" ]; then
            echo "::error::DHUN beta must be marked as a prerelease"
            exit 1
          fi
          gh release view beta --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,targetCommitish,assets \
            --jq '{tagName,name,isDraft,isPrerelease,targetCommitish,assets:[.assets[].name]}'

          # Migration is complete only after the replacement is public and
          # verified. No legacy test release or tag is left advertising the old
          # channel, and no fixed public release is touched.
          if gh release view test --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete test --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi

  publish:
    # A reviewed, newly added intent file on main or a deliberate manual
    # dispatch may publish. Neither PRs nor ordinary main pushes can do so.
    if: ${{ github.ref == 'refs/heads/main' && needs.release_plan.outputs.channel == 'public' && needs.release_plan.outputs.build_only == 'false' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_only == false)) }}
    needs: [release_plan, apk, msi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: apk
          path: dist

      - uses: actions/download-artifact@v7
        with:
          name: msi
          path: dist

      - name: Verify the build is still the tip of main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::error::Refusing to publish a superseded main commit ($GITHUB_SHA; current $latest)"
            exit 1
          fi

      # Irreversible. Deletes the legacy dev releases and their tags, so it runs
      # only when the maintainer ticks purge_legacy_dev_releases on this dispatch
      # (default off). Keep it in its own step so the default path never reaches it.
      - name: Delete legacy dev releases (explicit opt-in only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.purge_legacy_dev_releases }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete dev-v0.1.0 --yes --cleanup-tag || true
          gh release delete dev-v0.1.1 --yes --cleanup-tag || true
          gh release delete dev --yes --cleanup-tag || true
          git push origin :refs/tags/dev || true

      - name: Stage, verify and publish the fixed v1.00.002 prerelease once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version='v1.00.002'
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            if [ "$(gh release view "$version" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" != "false" ]; then
              echo "::error::$version already exists but is still a draft; refusing to silently skip it."
              exit 1
            fi
            if [ "$(gh release view "$version" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')" != "true" ]; then
              echo "::error::$version already exists but is not marked as a prerelease; refusing to silently skip it."
              exit 1
            fi
            existing_target=$(gh release view "$version" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')
            if [ "$existing_target" != "$GITHUB_SHA" ]; then
              echo "::error::$version already targets $existing_target, not $GITHUB_SHA; refusing to mutate it."
              exit 1
            fi
            echo "The public $version prerelease already exists at $existing_target; leaving its assets and tag unchanged."
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$version" >/dev/null 2>&1; then
            echo "::error::Tag $version already exists without a release; refusing to move it."
            exit 1
          fi

          python scripts/stage_versioned_release.py dist "dist/$version" --version '1.00.002'
          gh release create "$version" \
            "dist/$version/dhun-v1.00.002.apk" \
            "dist/$version/dhun-v1.00.002.apk.sha256" \
            "dist/$version/dhun-v1.00.002.apk.provenance.txt" \
            "dist/$version/dhun-v1.00.002-arm64-v8a.apk" \
            "dist/$version/dhun-v1.00.002-arm64-v8a.apk.sha256" \
            "dist/$version/dhun-v1.00.002-arm64-v8a.apk.provenance.txt" \
            "dist/$version/dhun-v1.00.002-armeabi-v7a.apk" \
            "dist/$version/dhun-v1.00.002-armeabi-v7a.apk.sha256" \
            "dist/$version/dhun-v1.00.002-armeabi-v7a.apk.provenance.txt" \
            "dist/$version/dhun-v1.00.002.msi" \
            "dist/$version/dhun-v1.00.002.msi.sha256" \
            "dist/$version/dhun-v1.00.002.msi.provenance.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DHUN v1.00.002 — public pre-release" \
            --notes-file docs/releases/v1.00.002.md \
            --draft --prerelease

          # A draft prevents a partial upload from looking like a finished
          # release. Verify all nonempty assets and identity before publication.
          expected_assets=$(printf '%s\n' \
            "dhun-$version.apk" "dhun-$version.apk.sha256" "dhun-$version.apk.provenance.txt" \
            "dhun-$version-arm64-v8a.apk" "dhun-$version-arm64-v8a.apk.sha256" "dhun-$version-arm64-v8a.apk.provenance.txt" \
            "dhun-$version-armeabi-v7a.apk" "dhun-$version-armeabi-v7a.apk.sha256" "dhun-$version-armeabi-v7a.apk.provenance.txt" \
            "dhun-$version.msi" "dhun-$version.msi.sha256" "dhun-$version.msi.provenance.txt" | jq -R . | jq -sc 'sort')
          actual_assets=$(gh release view "$version" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[] | select(.size > 0) | .name] | sort' | jq -c .)
          if [ "$actual_assets" != "$expected_assets" ]; then
            echo "::error::$version draft assets are missing, empty or unexpected; leaving the draft unpublished."
            exit 1
          fi
          if [ "$(gh release view "$version" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')" != "$GITHUB_SHA" ]; then
            echo "::error::$version draft targets the wrong commit; leaving it unpublished."
            exit 1
          fi
          if [ "$(gh release view "$version" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" != "true" ]; then
            echo "::error::$version must remain a draft until verification is complete."
            exit 1
          fi
          gh release edit "$version" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease

          gh release view "$version" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,targetCommitish --jq '{tagName,isDraft,isPrerelease,targetCommitish}'
          if [ "$(gh release view "$version" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')" != "$GITHUB_SHA" ]; then
            echo "::error::$version does not target the verified build"
            exit 1
          fi
          if [ "$(gh release view "$version" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" != "false" ]; then
            echo "::error::v1.00.002 must be published, not left as a draft"
            exit 1
          fi
          if [ "$(gh release view "$version" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')" != "true" ]; then
            echo "::error::v1.00.002 must stay marked as a prerelease"
            exit 1
          fi

  # Evidence transport only. This runs after a completed same-repository PR
  # Windows check, including failure diagnostics, and never mutates a release.
  msi_evidence:
    name: Publish installed Windows evidence
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (needs.msi.result == 'success' || needs.msi.result == 'failure') }}
    needs: [msi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: msi-install-check
          path: out/installer-check

      - name: Publish immutable installed-app frame and result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          root = Path("out/installer-check")
          repository = os.environ["GITHUB_REPOSITORY"]
          class PublicationFailure(Exception):
              pass

          def sanitized(value, limit=6000):
              text = str(value)
              token = os.environ.get("GH_TOKEN", "")
              if token:
                  text = text.replace(token, "<redacted>")
              text = re.sub(r"\b(?:gh[pousr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+)\b", "<redacted>", text)
              text = re.sub(r"(?i)(authorization\s*[:=]\s*)(?:bearer\s+|token\s+)?\S+", r"\1<redacted>", text)
              text = re.sub(r"(?i)(access_token=)[^&\s]+", r"\1<redacted>", text)
              return text[:limit]

          def annotate(level, title, message):
              escaped = sanitized(message).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::{level} title={title}::{escaped}", flush=True)

          result_path = root / "result.txt"
          result = result_path.read_text(encoding="utf-8") if result_path.exists() else ""
          diagnostics_path = root / "app-diagnostics.txt"
          diagnostics = diagnostics_path.read_text(encoding="utf-8") if diagnostics_path.exists() else ""
          # These annotations deliberately precede every Git/blob operation.
          # A publication failure must not hide the completed Windows result.
          annotate("notice" if result else "warning", "DHUN MSI result",
                   result.strip() or "result.txt unavailable; installer evidence is incomplete")
          annotate("notice" if diagnostics else "warning", "DHUN MSI launch diagnostics",
                   diagnostics.strip() or "app-diagnostics.txt unavailable; startup cause remains unclassified")

          def create_blob(raw, label):
              payload = json.dumps({
                  "encoding": "base64",
                  "content": base64.b64encode(raw).decode("ascii"),
              }).encode("utf-8")
              with tempfile.NamedTemporaryFile() as body:
                  body.write(payload)
                  body.flush()
                  completed = subprocess.run(
                      ["gh", "api", f"repos/{repository}/git/blobs", "--input", body.name, "--jq", ".sha"],
                      check=False, text=True, capture_output=True,
                  )
              if completed.returncode != 0:
                  detail = completed.stderr.strip() or completed.stdout.strip() or f"gh exited {completed.returncode}"
                  raise PublicationFailure(f"{label}: {sanitized(detail, 1200)}")
              blob = completed.stdout.strip()
              if not re.fullmatch(r"[0-9a-f]{40}", blob):
                  raise PublicationFailure(f"{label}: Git returned an invalid blob id")
              return blob

          try:
              if not result.strip():
                  raise PublicationFailure("result.txt is unavailable; refusing to publish an empty installer result")
              fields = dict(line.split("=", 1) for line in result.splitlines() if "=" in line)
              images = sorted(root.rglob("*.png"))
              if fields.get("appLaunch", "").startswith("passed") and not images:
                  raise PublicationFailure("Installed-app launch passed but no window PNG was preserved")

              entries = []
              for path in images:
                  blob = create_blob(path.read_bytes(), f"PNG {path.name}")
                  entries.append({
                      "name": path.relative_to(root).as_posix(),
                      "blob": blob,
                      "bytes": path.stat().st_size,
                      "kind": "actual upgraded DHUN.exe native window PNG; startup only",
                  })
              manifest = {
                  "workflow": "beta-release.yml",
                  "source": {"sha": os.environ["HEAD_SHA"], "run": os.environ["GITHUB_RUN_ID"]},
                  "scope": "Installed Windows package startup; no audible playback or visual acceptance claimed",
                  "result": result,
                  "safeLaunchDiagnostics": diagnostics,
                  "images": entries,
              }
              output = Path("build/test-evidence/packaged-windows-manifest.json")
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
              manifest_blob = create_blob(output.read_bytes(), "packaged Windows manifest")
          except Exception as error:
              # No traceback with command arguments, environment or blob data:
              # only the sanitized stage/API error, and a failing exit status.
              annotate("error", "DHUN packaged Windows evidence publication",
                       f"{type(error).__name__}: {sanitized(error, 1200)}")
              raise SystemExit(1)
          print(f"::notice title=DHUN packaged Windows evidence::manifest={manifest_blob} images={len(entries)}")
          PY
