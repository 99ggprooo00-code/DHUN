name: Build APK

# Fast, artifact-only debug APK for every push to main and every PR — the
# job a reviewer/agent uses to sanity-check "does Android still assemble"
# without waiting on the release pipeline. The public rolling DHUN beta and
# fixed v1.00.002 release are created by `beta-release.yml`; this one only
# uploads a run-scoped artifact and never replaces either release.
#
# Module names are not guesses in this repo: the Android application module is
# `:app-android` (settings.gradle.kts), NOT `:app` — `:app` is *ambiguous*
# (candidates `app-android`, `app-desktop`) and Gradle fails the task lookup.
# ABI splits replace the single `app-android-debug.apk`. assembleDebug writes
# `*universal*`, `*arm64-v8a*` and `*armeabi-v7a*` APKs under
# `app-android/build/outputs/apk/debug/`; beta-release.yml stages those three
# as the rolling-release names. This job only uploads the raw outputs.
# Every variant receives the same time-ordered beta versionCode as beta-release;
# public versionCode 7 must not make a PR artifact a downgrade over a beta build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Allocate increasing Android beta identity
        id: beta_version
        run: python scripts/beta_version.py "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Assemble debug APK
        env:
          BETA_VERSION_NAME: ${{ steps.beta_version.outputs.version_name }}
          BETA_VERSION_CODE: ${{ steps.beta_version.outputs.version_code }}
        run: |
          ./gradlew :app-android:assembleDebug \
            "-PdhunReleaseChannel=development" \
            "-PdhunBetaVersionName=$BETA_VERSION_NAME" \
            "-PdhunBetaVersionCode=$BETA_VERSION_CODE" \
            --no-daemon

      - name: Verify all APK packages and signatures
        env:
          BETA_VERSION_NAME: ${{ steps.beta_version.outputs.version_name }}
          BETA_VERSION_CODE: ${{ steps.beta_version.outputs.version_code }}
        run: |
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$aapt"
          test -n "$apksigner"
          python scripts/check_android_identity.py "$aapt" \
            app-android/build/outputs/apk/debug \
            "$BETA_VERSION_NAME" "$BETA_VERSION_CODE" --apksigner "$apksigner"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: debug-apk
          if-no-files-found: error
          path: app-android/build/outputs/apk/debug/*.apk
