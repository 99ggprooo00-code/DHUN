name: extraction-health

# Attempt 4 — fresh workflow file with distinct name/path to bypass
# corrupted registration of rot-drill (ids 348098190, 360227450).
# Both previous ids show name = file path, not declared name, and
# fire phantom 0-job push runs despite no push: trigger.
# This file uses a completely new path and name to force a clean
# registration. If it also wedges, the repo's workflow registration
# layer is globally broken and only GitHub Support (ticket #4765894)
# can reset it.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: extraction-health
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Record environment and install extractors
        run: |
          {
            echo "=== EXTRACTION-HEALTH ENVIRONMENT ==="
            echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Runner: $(uname -s) $(uname -r) $(uname -m)"
            echo "Java: $(java -version 2>&1 | head -n 1)"
            echo "Python: $(python3 --version 2>&1)"
          } 2>&1 | tee rot-drill.log
          python -m pip install --upgrade pip yt-dlp 2>&1 | tee -a rot-drill.log
          echo "Installed yt-dlp: $(yt-dlp --version 2>&1 || echo 'failed')" | tee -a rot-drill.log

      - name: Run playback probes (offline + live)
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          set +e

          echo "=== 1. DETERMINISTIC OFFLINE PROBE (ADR-006) ===" | tee -a rot-drill.log
          ./gradlew :tools:playback-probe:offlineProbe --no-daemon --console=plain 2>&1 | tee -a rot-drill.log
          offline_status=${PIPESTATUS[0]}

          echo "=== 2. LIVE EXTRACTION AND STREAM PROBE ===" | tee -a rot-drill.log
          ./gradlew :tools:playback-probe:run --no-daemon --console=plain 2>&1 | tee -a rot-drill.log
          live_status=${PIPESTATUS[0]}

          echo "PROBE|workflow-status|offline=$offline_status|live=$live_status" | tee -a rot-drill.log
          if [ "$offline_status" -ne 0 ] || [ "$live_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rot-drill-${{ github.run_id }}
          path: rot-drill.log
          if-no-files-found: error
          retention-days: 14

      - name: Classify probe result
        if: always()
        id: classify
        shell: bash
        run: |
          set -u
          offline=$(grep -E '^PROBE\|offline-verdict\|' rot-drill.log | tail -n 1 | cut -d'|' -f 3 || true)
          live=$(grep -E '^PROBE\|verdict\|' rot-drill.log | tail -n 1 | cut -d'|' -f 3 || true)
          workflow_status=$(grep -E '^PROBE\|workflow-status\|' rot-drill.log | tail -n 1 || true)
          offline_cmd="${workflow_status#*offline=}"
          offline_cmd="${offline_cmd%%|*}"
          live_cmd="${workflow_status#*live=}"
          live_cmd="${live_cmd%%|*}"

          if [ "$offline" != "PASS" ] || [ "${offline_cmd:-}" != "0" ]; then
            classification="FAIL"
            reason="the deterministic offline check or its workflow command failed"
          elif [ "$live" = "ENVIRONMENT_BLOCKED" ]; then
            classification="ENVIRONMENT_BLOCKED"
            reason="YouTube returned explicit bot-gating/authentication evidence to the GitHub runner"
          elif [ "$live" = "UNAVAILABLE" ]; then
            classification="UNAVAILABLE"
            reason="the external live extraction service was unavailable"
          elif [ "$live" = "PASS" ] && [ "${live_cmd:-}" = "0" ]; then
            classification="PASS"
            reason="all required probe stages passed"
          else
            classification="FAIL"
            reason="the live probe did not produce a passing or classified verdict"
          fi

          echo "classification=$classification" >> "$GITHUB_OUTPUT"
          echo "offline=$offline" >> "$GITHUB_OUTPUT"
          echo "live=$live" >> "$GITHUB_OUTPUT"
          {
            echo "### Extraction-health classification"
            echo "- Classification: **$classification**"
            echo "- Offline verdict: \`$offline\`"
            echo "- Live verdict: \`${live:-MISSING}\`"
            echo "- Reason: $reason"
            if [ "$classification" = "ENVIRONMENT_BLOCKED" ]; then
              echo
              echo "> This is an external GitHub/YouTube runner limitation, not evidence that DHUN's shared resolver is broken. The check remains non-zero because live stream health was not established."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report external live-probe limitation
        if: steps.classify.outputs.classification == 'ENVIRONMENT_BLOCKED' || steps.classify.outputs.classification == 'UNAVAILABLE'
        shell: bash
        run: |
          echo "::warning title=Extraction health is not a production pass::${{ steps.classify.outputs.classification }} — inspect the probe log and verify playback outside the GitHub runner."

      - name: Open or update a rot-drill issue
        if: steps.probe.outcome == 'failure' && steps.classify.outputs.classification == 'FAIL'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact="rot-drill-${GITHUB_RUN_ID}"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          cat <<EOF > issue_body.md
          extraction-health failed on ${GITHUB_SHA}

          Run: ${run_url}
          Trigger: ${GITHUB_EVENT_NAME}

          The attached \`${artifact}\` artifact contains the full engine-version + Gradle/probe log.

          ### Last probe output:
          \`\`\`
          EOF

          tail -c 12000 rot-drill.log >> issue_body.md

          cat <<EOF >> issue_body.md
          \`\`\`

          > *Note: If errors indicate bot-gating / IP challenge (\`LOGIN_REQUIRED\` / \`Sign in to confirm you're not a bot\`), GitHub runner datacenter IPs may be gated by YouTube while residential IPs remain unaffected. Verify residential playback independently.*
          EOF

          open_issue=$(gh issue list --state open --limit 1 --search 'rot-drill in:title' --json number --jq '.[0].number // empty')
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" -F issue_body.md
          else
            gh issue create \
              --title "[rot-drill] Live extraction probe failed" \
              -F issue_body.md
          fi

      - name: Close a recovered rot-drill issue
        if: steps.probe.outcome == 'success' && steps.classify.outputs.classification == 'PASS'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          open_issue=$(gh issue list --state open --limit 1 --search 'rot-drill in:title' --json number --jq '.[0].number // empty')
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --body "extraction-health recovered on ${GITHUB_SHA}. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            gh issue close "$open_issue" --comment "Closed automatically after a green live probe."
          fi

      - name: Keep the check non-zero when live health is unverified
        if: steps.probe.outcome == 'failure'
        shell: bash
        run: |
          classification="${{ steps.classify.outputs.classification }}"
          case "$classification" in
            ENVIRONMENT_BLOCKED)
              echo "Extraction health is ENVIRONMENT_BLOCKED: live stream health was not established on this runner."
              exit 2
              ;;
            UNAVAILABLE)
              echo "Extraction health is UNAVAILABLE: the external live service did not provide a health result."
              exit 3
              ;;
            *)
              echo "Extraction health detected a DHUN/probe failure."
              exit 1
              ;;
          esac
