name: dev-release

# Builds the debug APK and publishes it as a GitHub Release whenever a
# dev-v* tag is pushed. This is the pre-store distribution channel for
# on-device verification builds.

on:
  push:
    tags: ['dev-v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build debug APK
        run: ./gradlew :app-android:assembleDebug --no-daemon

      - name: Stage artifact
        run: |
          cp app-android/build/outputs/apk/debug/app-android-debug.apk dhun-debug.apk
          sha256sum dhun-debug.apk > dhun-debug.apk.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "DHUN dev build ${{ github.ref_name }}"
          body: |
            Development build (debug-signed) for on-device verification.

            **Install on Android:**
            1. Download `dhun-debug.apk` on your phone
            2. Open it; allow "Install unknown apps" for your browser when asked
            3. Install (Play Protect may warn — expected for unsigned store builds; choose Install anyway)

            Pre-release software — current limitations: KNOWN_LIMITATIONS.md.
            What to verify: docs/verification/03-android-skeleton.md
          files: |
            dhun-debug.apk
            dhun-debug.apk.sha256
          draft: false
          prerelease: true
