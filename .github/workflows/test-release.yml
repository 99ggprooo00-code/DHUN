name: test-release

# The rolling `test` tag is a private draft for collaborators. One fixed,
# public prerelease (v1.00.001) is created once from a successful main build.
# Builds on PRs and non-main refs only upload run-scoped artifacts.
on:
  workflow_dispatch:
    inputs:
      build_only:
        description: Build artifacts without updating GitHub releases
        type: boolean
        required: true
        default: true
      build_release_candidate:
        description: Also build a debug-signed Android App Bundle as an Actions artifact
        type: boolean
        required: true
        default: false
      purge_legacy_dev_releases:
        description: Irreversibly delete the legacy dev, dev-v0.1.0 and dev-v0.1.1 releases and tags. Publish path only. Leave unticked unless approved for this run.
        type: boolean
        required: true
        default: false
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  BUILD_ONLY: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_only) || github.ref != 'refs/heads/main' }}

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'test-release' || format('test-build-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Build debug APK
        run: ./gradlew :app-android:assembleDebug --no-daemon

      - name: Stage universal and ABI APKs with checksums and provenance
        run: |
          python scripts/stage_android_apks.py \
            app-android/build/outputs/apk/debug \
            out
          python scripts/stage_artifact.py out/dhun-test.apk --build-only "$BUILD_ONLY"
          python scripts/stage_artifact.py out/dhun-test-arm64-v8a.apk --build-only "$BUILD_ONLY"
          python scripts/stage_artifact.py out/dhun-test-armeabi-v7a.apk --build-only "$BUILD_ONLY"

      - uses: actions/upload-artifact@v6
        with:
          name: apk
          if-no-files-found: error
          retention-days: 14
          path: |
            out/dhun-test.apk
            out/dhun-test.apk.sha256
            out/dhun-test.apk.provenance.txt
            out/dhun-test-arm64-v8a.apk
            out/dhun-test-arm64-v8a.apk.sha256
            out/dhun-test-arm64-v8a.apk.provenance.txt
            out/dhun-test-armeabi-v7a.apk
            out/dhun-test-armeabi-v7a.apk.sha256
            out/dhun-test-armeabi-v7a.apk.provenance.txt

  msi:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Build MSI (jpackage)
        id: msi_build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = python scripts/installer_version.py $env:GITHUB_RUN_NUMBER $env:GITHUB_RUN_ATTEMPT
          if ($LASTEXITCODE -ne 0) { throw "Could not allocate MSI ProductVersion" }
          "installer_version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "MSI ProductVersion: $version"
          ./gradlew :app-desktop:packageMsi "-PdhunInstallerVersion=$version" --no-daemon

      - name: Verify MSI identity and stage checksum/provenance
        shell: pwsh
        env:
          INSTALLER_VERSION: ${{ steps.msi_build.outputs.installer_version }}
        run: |
          try {
            ./scripts/stage_msi.ps1 -ExpectedVersion $env:INSTALLER_VERSION -BuildOnly $env:BUILD_ONLY
          } catch {
            $message = $_.ToString().Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error file=scripts/stage_msi.ps1,title=MSI staging::$message"
            exit 1
          }

      # On main (the only publishing path) install-over is REQUIRED: a skipped
      # baseline fails this step instead of passing green. PR and branch builds
      # may skip, and the skip is recorded as SKIPPED in result.txt.
      - name: Check install-over and userdata on disposable Windows
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRE_INSTALL_OVER: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
        run: |
          try {
            $require = $env:REQUIRE_INSTALL_OVER -eq 'true'
            ./scripts/check_msi_upgrade.ps1 -Candidate out/dhun-test.msi -RequireInstallOver:$require
          } catch {
            $message = $_.ToString().Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error file=scripts/check_msi_upgrade.ps1,title=MSI install-over::$message"
            exit 1
          }

      - name: Preserve installer-check diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: msi-install-check
          if-no-files-found: ignore
          retention-days: 14
          path: out/installer-check/

      - uses: actions/upload-artifact@v6
        with:
          name: msi
          if-no-files-found: error
          retention-days: 14
          path: |
            out/dhun-test.msi
            out/dhun-test.msi.sha256
            out/dhun-test.msi.provenance.txt
            out/READ-ME-FIRST.md

  aab:
    # Optional diagnostic artifact only; debug-key signed and not Play-ready.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release_candidate == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Build debug-signed AAB
        run: ./gradlew :app-android:bundleDebug --no-daemon

      - name: Stage optional AAB
        run: |
          mkdir -p out
          cp app-android/build/outputs/bundle/debug/app-android-debug.aab out/dhun-v1.00.001.aab
          python scripts/stage_artifact.py out/dhun-v1.00.001.aab --build-only "$BUILD_ONLY"

      - uses: actions/upload-artifact@v6
        with:
          name: aab
          if-no-files-found: error
          retention-days: 14
          path: |
            out/dhun-v1.00.001.aab
            out/dhun-v1.00.001.aab.sha256
            out/dhun-v1.00.001.aab.provenance.txt

  publish:
    # Only a deliberate, manual dispatch from main can mutate a release. A push
    # (including a merge to main) builds and tests only and never publishes, and
    # the branch build path cannot publish even if build_only=false is set there.
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.build_only == false }}
    needs: [apk, msi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: apk
          path: dist

      - uses: actions/download-artifact@v7
        with:
          name: msi
          path: dist

      - name: Verify the build is still the tip of main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::error::Refusing to publish a superseded main commit ($GITHUB_SHA; current $latest)"
            exit 1
          fi

      # Irreversible. Deletes the legacy dev releases and their tags, so it runs
      # only when the maintainer ticks purge_legacy_dev_releases on this dispatch
      # (default off). Keep it in its own step so the default path never reaches it.
      - name: Delete legacy dev releases (explicit opt-in only)
        if: ${{ inputs.purge_legacy_dev_releases }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete dev-v0.1.0 --yes --cleanup-tag || true
          gh release delete dev-v0.1.1 --yes --cleanup-tag || true
          gh release delete dev --yes --cleanup-tag || true
          git push origin :refs/tags/dev || true

      # The private rolling draft is replaced on every manual publish by design.
      - name: Replace the private rolling test draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete test --yes --cleanup-tag || true
          git push origin :refs/tags/test || true

          gh release create test \
            dist/dhun-test.apk dist/dhun-test.apk.sha256 dist/dhun-test.apk.provenance.txt \
            dist/dhun-test-arm64-v8a.apk dist/dhun-test-arm64-v8a.apk.sha256 dist/dhun-test-arm64-v8a.apk.provenance.txt \
            dist/dhun-test-armeabi-v7a.apk dist/dhun-test-armeabi-v7a.apk.sha256 dist/dhun-test-armeabi-v7a.apk.provenance.txt \
            dist/dhun-test.msi dist/dhun-test.msi.sha256 dist/dhun-test.msi.provenance.txt \
            --target "$GITHUB_SHA" \
            --title "DHUN rolling test build (private draft)" \
            --notes-file docs/releases/rolling-test.md \
            --draft --prerelease

          gh release view test --json tagName,isDraft,isPrerelease,targetCommitish --jq '{tagName,isDraft,isPrerelease,targetCommitish}'
          if [ "$(gh release view test --json isDraft --jq '.isDraft')" != "true" ]; then
            echo "::error::The rolling test release must remain a private draft"
            exit 1
          fi

      - name: Create the fixed v1.00.001 public prerelease once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version='v1.00.001'
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            if [ "$(gh release view "$version" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" != "false" ]; then
              echo "::error::$version already exists but is still a draft; refusing to silently skip it."
              exit 1
            fi
            if [ "$(gh release view "$version" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')" != "true" ]; then
              echo "::error::$version already exists but is not marked as a prerelease; refusing to silently skip it."
              exit 1
            fi
            echo "The public $version prerelease already exists; leaving its assets and tag unchanged."
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$version" >/dev/null 2>&1; then
            echo "::error::Tag $version already exists without a release; refusing to move it."
            exit 1
          fi

          python scripts/stage_versioned_release.py dist "dist/$version" --version '1.00.001'
          gh release create "$version" \
            "dist/$version/dhun-v1.00.001.apk" \
            "dist/$version/dhun-v1.00.001.apk.sha256" \
            "dist/$version/dhun-v1.00.001.apk.provenance.txt" \
            "dist/$version/dhun-v1.00.001-arm64-v8a.apk" \
            "dist/$version/dhun-v1.00.001-arm64-v8a.apk.sha256" \
            "dist/$version/dhun-v1.00.001-arm64-v8a.apk.provenance.txt" \
            "dist/$version/dhun-v1.00.001-armeabi-v7a.apk" \
            "dist/$version/dhun-v1.00.001-armeabi-v7a.apk.sha256" \
            "dist/$version/dhun-v1.00.001-armeabi-v7a.apk.provenance.txt" \
            "dist/$version/dhun-v1.00.001.msi" \
            "dist/$version/dhun-v1.00.001.msi.sha256" \
            "dist/$version/dhun-v1.00.001.msi.provenance.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DHUN v1.00.001 — public pre-release" \
            --notes-file docs/releases/v1.00.001.md \
            --prerelease

          gh release view "$version" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,targetCommitish --jq '{tagName,isDraft,isPrerelease,targetCommitish}'
          if [ "$(gh release view "$version" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" != "false" ]; then
            echo "::error::v1.00.001 must be published, not left as a draft"
            exit 1
          fi
          if [ "$(gh release view "$version" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')" != "true" ]; then
            echo "::error::v1.00.001 must stay marked as a prerelease"
            exit 1
          fi
