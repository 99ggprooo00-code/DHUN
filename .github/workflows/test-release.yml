name: test-release

# ONE rolling test release, by policy (user decision 2026-09-01):
#  - a single release tagged `test`, assets ALWAYS named dhun-test.apk
#    and dhun-test.msi
#  - every push to main REPLACES it (old release, tag and assets deleted)
#  - no version numbers, no release history for unfinished builds
# The stable download URLs never change:
#   https://github.com/99ggprooo00-code/DHUN/releases/download/test/dhun-test.apk
#   https://github.com/99ggprooo00-code/DHUN/releases/download/test/dhun-test.msi
#
# Phase 12 (2026-09-05): Windows MSI added. `:app-desktop:packageMsi` runs
# jpackage on a windows-latest runner (JDK 17 ships the WiX toolset). The
# MSI needs a VLC install at runtime (vlcj dynamic link — see THIRD_PARTY).

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: test-release
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build debug APK
        run: ./gradlew :app-android:assembleDebug --no-daemon

      - name: Stage + checksum
        run: |
          cp app-android/build/outputs/apk/debug/app-android-debug.apk dhun-test.apk
          sha256sum dhun-test.apk > dhun-test.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            dhun-test.apk
            dhun-test.apk.sha256

  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # packageMsi = Compose Desktop 1.8.2 task (NOT createMsi — that name
      # doesn't exist in this plugin version; CI 33950291501 proved it).
      # jpackage creates the MSI; output lands in
      # app-desktop/build/compose/binaries/mainMsi/<name>.msi
      - name: Build MSI (jpackage)
        run: ./gradlew :app-desktop:packageMsi --no-daemon

      # Recurse the whole compose build tree (run 33951385012: the MSI was
      # NOT where the old hardcoded path expected — and job logs were
      # unreadable from the agent, so the step now self-diagnoses by
      # dumping the tree it searched).
      - name: Stage + checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tree = "app-desktop/build/compose"
          $msi = $null
          if (Test-Path $tree) {
            $msi = Get-ChildItem -Path $tree -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $msi) {
            Write-Host "::error file=.github/workflows/test-release.yml,title=MSI staging::No .msi under app-desktop/build/compose (tree follows)"
            if (Test-Path "app-desktop/build") {
              Get-ChildItem -Path "app-desktop/build" -Recurse -ErrorAction SilentlyContinue |
                Select-Object -First 300 | ForEach-Object { Write-Host $_.FullName }
            }
            throw "No .msi found under $tree (tree dumped above)"
          }
          Write-Host ("Found MSI: " + $msi.FullName)
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item $msi.FullName out/dhun-test.msi
          $hash = (Get-FileHash out/dhun-test.msi -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path out/dhun-test.msi.sha256 -Value "$hash  dhun-test.msi" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: |
            out/dhun-test.msi
            out/dhun-test.msi.sha256

  publish:
    needs: [apk, msi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: msi
          path: dist

      - name: Replace the rolling test release (delete old, publish new)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # one-time cleanup: remove the historical dev-v* releases and tags
          gh release delete dev-v0.1.0 --yes --cleanup-tag || true
          gh release delete dev-v0.1.1 --yes --cleanup-tag || true
          gh release delete dev --yes --cleanup-tag || true
          git push origin :refs/tags/dev || true
          # rolling slot: always exactly one
          gh release delete test --yes --cleanup-tag || true
          git push origin :refs/tags/test || true

          cp dist/dhun-test.apk dist/dhun-test.msi .
          cp dist/dhun-test.apk.sha256 dist/dhun-test.msi.sha256 .
          gh release create test \
            dhun-test.apk dhun-test.apk.sha256 \
            dhun-test.msi dhun-test.msi.sha256 \
            --title "DHUN test build (auto-replaced on every update)" \
            --notes "Rolling UNVERIFIED development build of main. dhun-test.apk = Android, dhun-test.msi = Windows (playback needs a VLC install). Nothing here is stable, signed for stores, or recommended for daily-driver devices. Install only where that is acceptable. Current open checks: docs/verification/03-android-skeleton.md, docs/verification/12-desktop-native.md" \
            --prerelease
