name: CI

on:
  push:
    # Session branches build too: a commit pushed to `arena/**` before its PR
    # exists used to get NO CI at all, silently (2026-09-06 handoff, Task B).
    branches: [main, "arena/**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Packaging and fixture helper tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: PowerShell packaging helper syntax
        shell: pwsh
        run: ./scripts/check_powershell_syntax.ps1

      - name: "Unit tests — shared domain (queue, parsers, resolvers)"
        run: ./gradlew :shared:jvmTest --no-daemon

      # Named explicitly so a red Android suite cannot hide behind the
      # assembleDebug coupling (app-android/build.gradle.kts). That
      # dependsOn stays: packaging jobs (test-release / Build APK) still
      # invoke only assembleDebug, and must keep failing on a red test.
      - name: "Unit tests — Android (Robolectric)"
        run: ./gradlew :app-android:testDebugUnitTest --no-daemon

      - name: Android debug build
        run: ./gradlew :app-android:assembleDebug --no-daemon

      # S6 requires a clean-target install of APK + AAB + MSI. The AAB is only
      # ever built by test-release.yml's `aab` job, which is
      # `workflow_dispatch`-gated — and the maintenance agent's token gets
      # HTTP 403 on dispatch (verified: `gh workflow run test-release.yml` →
      # "Resource not accessible by integration"). So `:app-android:bundleDebug`
      # had NO automated coverage, while PR #131 added a `splits { abi }` block
      # to this module after that job last ran. A bundle path that only breaks
      # at release time is the worst place to discover it.
      - name: "Android App Bundle compiles (S6 AAB gate)"
        run: ./gradlew :app-android:bundleDebug --no-daemon

      # minSdk is 24 (Android 7.0). Nothing else in CI compiles against that
      # floor: assembleDebug happily links API-26+ calls that crash on API 24-25.
      # NewApi (scoped in app-android/build.gradle.kts) fails the build on them.
      - name: "Android Lint — API 24 floor (NewApi)"
        run: ./gradlew :app-android:lintDebug --no-daemon

      # The step above only analyses :app-android's own sources: AGP does not
      # lint a module's library dependencies unless `checkDependencies` is set.
      # shared/src/androidMain holds the expect/actual Android code
      # (connectivity, blur, download transport, storage probes), so it needs
      # its own NewApi run. Config lives in shared/build.gradle.kts lint { }.
      - name: "Android Lint — shared androidMain API 24 floor (NewApi)"
        run: ./gradlew :shared:lintDebug --no-daemon

      - name: Probe compiles
        run: ./gradlew :tools:playback-probe:compileKotlin --no-daemon

      - name: "Unit tests — extraction-health classification"
        run: ./gradlew :tools:playback-probe:test --no-daemon

      # Desktop was previously only compiled by the MSI job on pushes to main;
      # PRs touching app-desktop (Phase 12/14) must fail here, not after merge.
      - name: Desktop compiles
        run: ./gradlew :app-desktop:compileKotlinJvm --no-daemon

      # The desktop jvmTest source set (jump-list/tray pure cores) exists
      # since candidate 27 but was never executed by CI — compileKotlinJvm
      # only compiles jvmMain. It runs after the compile step so a compile
      # break and a red test fail different, honestly-named steps.
      - name: "Unit tests — Desktop (JVM)"
        run: ./gradlew :app-desktop:jvmTest --no-daemon
