name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Ground truth until the Gradle build exists (Phase 02+): keep repo
  # hygiene + doc-link checks green. Replaced by real build+test jobs in
  # Phase 02 per MASTER_PROMPT.md.
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Markdown link check (internal links)
        run: |
          ! grep -rnE '\]\(([^)h]+)\.md\)' --include='*.md' . \
            | grep -vE 'https?://' || true
      - name: No TODO/FIXME in production docs
        run: ! grep -rn 'TODO: implement' --include='*.md' .
