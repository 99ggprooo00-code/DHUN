name: diag-home-live

# TEMPORARY diagnostic (session arena/09e5238e-dhun, Home-loading failure).
# Deleted before this branch is proposed for merge.
#
# Probe 2 answers what probe 1 could not: does DHUN's own parser accept a
# *live* anonymous FEmusic_home response, and does the country context change
# the answer (the failing device is in Nepal, the runner is in the US).
# The live JSON never leaves the runner; only the parse verdict is annotated.

on:
  push:
    branches: [arena/09e5238e-dhun]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Capture live Home responses for two country contexts
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import json, re, urllib.request, urllib.error, os

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36")

          def emit(text):
              text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::warning title=home-probe::{text}", flush=True)

          req = urllib.request.Request("https://music.youtube.com/",
                                       headers={"User-Agent": UA, "Accept-Language": "en-US,en;q=0.9"})
          with urllib.request.urlopen(req, timeout=30) as r:
              html = r.read().decode("utf-8", "replace")
          version = re.search(r'"INNERTUBE_CLIENT_VERSION":"([0-9.]+)"', html).group(1)
          visitor = re.search(r'"visitorData"\s*:\s*"([^"]+)"', html).group(1)
          emit(f"clientVersion={version} visitorPresent=True")

          def fetch(gl, path):
              body = {"context": {"client": {"clientName": "WEB_REMIX", "clientVersion": version,
                                             "hl": "en", "gl": gl},
                                  "user": {}},
                      "browseId": "FEmusic_home"}
              headers = {"Content-Type": "application/json", "User-Agent": UA,
                         "Accept-Language": "en-US,en;q=0.9", "X-YouTube-Client-Name": "67",
                         "X-YouTube-Client-Version": version, "X-Goog-Visitor-Id": visitor,
                         "Origin": "https://music.youtube.com",
                         "Referer": "https://music.youtube.com/"}
              data = json.dumps(body).encode()
              r = urllib.request.Request("https://music.youtube.com/youtubei/v1/browse?alt=json",
                                         data=data, headers=headers, method="POST")
              try:
                  with urllib.request.urlopen(r, timeout=40) as resp:
                      status, text = resp.status, resp.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  status, text = e.code, e.read().decode("utf-8", "replace")
              except Exception as e:
                  status, text = -1, f"{type(e).__name__}: {e}"
              emit(f"gl={gl} http={status} bytes={len(text)}")
              if status == 200:
                  open(path, "w").write(text)
                  raw = json.loads(text)
                  c = raw.get("contents") or {}
                  b = c.get("singleColumnBrowseResultsRenderer") or c.get("twoColumnBrowseResultsRenderer") or {}
                  tabs = b.get("tabs") or []
                  ren = []
                  for t in tabs:
                      if isinstance(t, dict):
                          x = t.get("tabRenderer") or t.get("musicTabRenderer")
                          if isinstance(x, dict):
                              ren.append(x)
                  slr = {}
                  for x in ren:
                      slr = (x.get("content") or {}).get("sectionListRenderer") or {}
                      if slr:
                          break
                  items = slr.get("contents") or []
                  emit(f"gl={gl} sections={len(items)} kinds=" +
                       ",".join(sorted({k for i in items if isinstance(i, dict) for k in i})) +
                       f" sectionContinuations={len(slr.get('continuations') or [])} " +
                       f"actions={[k for k in ('onResponseReceivedActions','onResponseReceivedCommands') if k in raw]}")
              else:
                  emit(f"gl={gl} errorBody={text[:240]}")

          os.makedirs("probe", exist_ok=True)
          fetch("US", "probe/home-us.json")
          fetch("NP", "probe/home-np.json")
          PY
          ls -la probe 2>/dev/null || true

      - name: Parse the live responses with DHUN's own parser
        shell: bash
        run: |
          set +e
          mkdir -p shared/src/jvmTest/kotlin/dev/dhun/innertube
          cat > shared/src/jvmTest/kotlin/dev/dhun/innertube/LiveHomeShapeProbeTest.kt <<'KT'
          package dev.dhun.innertube

          import java.io.File
          import kotlinx.serialization.json.Json
          import kotlinx.serialization.json.JsonObject
          import kotlin.test.Test

          class LiveHomeShapeProbeTest {
              @Test
              fun parseLiveHomeResponses() {
                  val out = StringBuilder()
                  for (name in listOf("home-us", "home-np")) {
                      val file = File(projectRoot(), "probe/$name.json")
                      if (!file.isFile) { out.appendLine("$name SKIP no file"); continue }
                      val root = Json.parseToJsonElement(file.readText()) as JsonObject
                      try {
                          val page = parseHomeFeedPage(root)
                          val first = page.sections.firstOrNull()
                          out.appendLine(
                              "$name PASS sections=${page.sections.size} " +
                                  "items=${page.sections.sumOf { it.items.size }} " +
                                  "token=${page.continuationToken != null} " +
                                  "firstTitle=${first?.title ?: "-"} " +
                                  "firstKind=${first?.items?.firstOrNull()?.let { it::class.simpleName } ?: "-"}"
                          )
                      } catch (t: Throwable) {
                          out.appendLine("$name FAIL ${t::class.simpleName}: ${t.message}")
                      }
                  }
                  File(projectRoot(), "probe/parse-result.txt").writeText(out.toString())
                  println(out)
              }

              private fun projectRoot(): File {
                  var dir = File(".").absoluteFile
                  while (dir.parentFile != null && !File(dir, "settings.gradle.kts").isFile) {
                      dir = dir.parentFile
                  }
                  return dir
              }
          }
          KT
          ./gradlew :shared:jvmTest --tests 'dev.dhun.innertube.LiveHomeShapeProbeTest' --no-daemon --console=plain > probe-gradle.txt 2>&1
          echo "gradle exit=$?"
          tail -n 25 probe-gradle.txt
          echo "--- annotation pass ---"
          python3 - <<'PY'
          import os
          for path in ("probe/parse-result.txt",):
              if os.path.isfile(path):
                  for line in open(path):
                      line = line.rstrip("\n")
                      if line.strip():
                          esc = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                          print(f"::warning title=dhun-parser::{esc}", flush=True)
              else:
                  print("::warning title=dhun-parser::no parse-result.txt (test did not run)", flush=True)
          if os.path.isfile("probe-gradle.txt"):
              errs = [l for l in open("probe-gradle.txt") if "error:" in l or "FAILED" in l]
              for line in errs[:8]:
                  esc = line.strip().replace("%", "%25")
                  print(f"::error title=gradle::{esc}", flush=True)
          PY
