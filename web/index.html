<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a0a">
<title>DHUN — Web</title>
<meta name="description" content="DHUN web client. Dark, glassy music player that streams through a DHUN Bridge.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230a0a0a'/%3E%3Cpath d='M12 5v9.55A3.5 3.5 0 1 0 14 17.5V8h3.5V5H12z' fill='%23bb86fc'/%3E%3C/svg%3E">
<!--
  DHUN Web client. Static-only: no build step, no framework, no server code.
  Design tokens come from the app's own DhunTokens (see assets/tokens.css).
  Music requires a DHUN Bridge — see web/README.md for why a browser cannot
  resolve YouTube streams on its own.
-->
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/dhun.css">
</head>
<body>
<div class="app">

  <!-- ------------------------------------------------------- sidebar ---- -->
  <aside class="sidebar">
    <div class="wordmark"><span class="wordmark-dot"></span>DHUN</div>

    <nav class="nav">
      <button class="nav-item" id="navSearch" type="button" aria-current="page">
        <span id="navSearchIcon"></span>Search
      </button>
      <button class="nav-item" id="navQueue" type="button" aria-current="false">
        <span id="navQueueIcon"></span>Queue
      </button>
    </nav>

    <div class="sidebar-footer">
      <section class="bridge" aria-labelledby="bridgeHeading">
        <div class="bridge-head">
          <span id="bridgeIcon"></span>
          <span id="bridgeHeading">Bridge</span>
          <span class="status-dot" id="bridgeDot" data-state=""></span>
        </div>

        <div class="bridge-row">
          <input class="bridge-input" id="bridgeInput" type="url" inputmode="url"
                 spellcheck="false" autocomplete="off"
                 placeholder="http://localhost:8787"
                 aria-label="DHUN Bridge base URL">
        </div>

        <div class="bridge-row">
          <button class="btn btn-accent" id="bridgeConnect" type="button" style="flex:1">Connect</button>
          <button class="btn btn-ghost" id="bridgeDisconnect" type="button" disabled>Clear</button>
        </div>

        <p class="queue-empty" id="bridgeLabel" role="status">No bridge</p>

        <button class="btn btn-ghost btn-block" id="demoToggle" type="button">
          <span id="demoIcon"></span>Load demo audio
        </button>
      </section>
    </div>
  </aside>

  <!-- ---------------------------------------------------------- main ---- -->
  <main class="main">
    <div class="searchbar">
      <label class="search-field">
        <span id="searchIcon"></span>
        <input id="searchInput" type="search" autocomplete="off" spellcheck="false"
               placeholder="Search songs, artists, albums" aria-label="Search">
      </label>
    </div>

    <h1 class="hero" id="mainHeading">Search</h1>
    <p class="hero-sub" id="mainSub">Results come from your DHUN Bridge.</p>

    <section id="results" aria-live="polite"></section>
  </main>

  <!-- --------------------------------------------------------- queue ---- -->
  <aside class="queue" aria-labelledby="queueHeading">
    <div class="queue-head">
      <h2 id="queueHeading">Up next</h2>
      <span class="queue-count" id="queueCount">0 tracks</span>
    </div>
    <div id="queueList"></div>
  </aside>

  <!-- ---------------------------------------------------- miniplayer ---- -->
  <footer class="miniplayer">
    <div class="mp-now">
      <img class="mp-artwork" id="mpArtwork" alt="Open full-screen player" tabindex="0" role="button">
      <div class="mp-meta">
        <span class="mp-title" id="mpTitle" tabindex="0" role="button">Nothing playing</span>
        <span class="mp-artist" id="mpArtist">Pick a track to begin</span>
      </div>
    </div>

    <div class="transport">
      <div class="transport-buttons">
        <button class="tbtn" id="shuffleBtn" type="button" aria-pressed="false" aria-label="Shuffle"></button>
        <button class="tbtn" id="prevBtn" type="button" aria-label="Previous track" disabled></button>
        <button class="tbtn tbtn-play" id="playBtn" type="button" aria-label="Play"></button>
        <button class="tbtn" id="nextBtn" type="button" aria-label="Next track" disabled></button>
        <button class="tbtn" id="repeatBtn" type="button" aria-pressed="false" aria-label="Repeat"></button>
      </div>
      <div class="progress">
        <span class="time" id="timeNow">0:00</span>
        <input id="seek" type="range" min="0" max="0" step="1" value="0"
               aria-label="Seek" disabled>
        <span class="time" id="timeTotal">0:00</span>
      </div>
    </div>

    <div class="mp-right">
      <button class="tbtn" id="volumeBtn" type="button" aria-label="Mute"></button>
      <div class="volume">
        <input id="volume" type="range" min="0" max="100" step="1" value="85" aria-label="Volume">
      </div>
    </div>
  </footer>
</div>

<!-- --------------------------------------------------- full-screen player - -->
<div class="fullscreen" id="fullscreen" data-open="false" role="dialog" aria-modal="true"
     aria-label="Now playing">
  <div class="fullscreen-art-bg" id="fsArtBg"></div>
  <div class="fullscreen-scrim"></div>

  <button class="tbtn fullscreen-close" id="fsClose" type="button" aria-label="Close"></button>

  <img class="fs-artwork" id="fsArtwork" alt="">
  <div class="fs-meta">
    <h2 class="fs-title" id="fsTitle">Nothing playing</h2>
    <p class="fs-artist" id="fsArtist"></p>
  </div>

  <div class="transport" id="fsTransport">
    <div class="transport-buttons">
      <button class="tbtn" id="fsPrev" type="button" aria-label="Previous track"></button>
      <button class="tbtn tbtn-play" id="fsPlay" type="button" aria-label="Play"></button>
      <button class="tbtn" id="fsNext" type="button" aria-label="Next track"></button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="assets/dhun.js"></script>
</body>
</html>
